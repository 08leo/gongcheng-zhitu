<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工程制图学习助手</title>
<link rel="stylesheet" href="css/style.css?v=20261112i">
<script>
  window.onerror = function(msg, url, line) {
    // ResizeObserver loop 是浏览器无害警告（尺寸通知跨帧），忽略不弹横幅
    if (/ResizeObserver loop/i.test(String(msg))) return true;
    var el = document.createElement('div');
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ee5a24;color:#fff;padding:8px 16px;font-size:13px;z-index:9999;font-family:monospace';
    el.textContent = 'JS Error: ' + msg + ' (line ' + line + ')';
    document.body.appendChild(el);
  };
</script>
<script src="js/three.min.js"></script>
</head>
<body>

<div id="topbar">
  <h1>🔧 工程制图学习助手</h1>
  <div class="tabs">
    <button class="tab-btn active" data-tab="crash">⚡ 速成</button>
    <button class="tab-btn" data-tab="practice">分章节学习</button>
    <button class="tab-btn" data-tab="guide">解题教程</button>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
    <span id="score-display" style="font-size:13px;color:var(--muted)">得分: <b style="color:var(--accent)">0</b></span>
  </div>
</div>

<div id="app">

  <!-- ═══════════ 考前速成 ═══════════ -->
  <div id="sec-crash" class="section active">
    <!-- 左侧：速记 + 题目列表 -->
    <div class="panel-left crash-left">
      <h2>⚡ 考前速成</h2>
      <div class="crash-cheat-wrap" id="crash-cheat"></div>
      <div class="crash-list" id="crash-list"></div>
    </div>

    <!-- 中央：3D 模型 + 题目视图 -->
    <div class="panel-center">
      <div class="view-switcher crash-switcher">
        <span id="crash-title" class="crash-title-bar"></span>
        <span style="flex:1"></span>
        <button class="crash-view-btn" data-v="front">主视</button>
        <button class="crash-view-btn" data-v="top">俯视</button>
        <button class="crash-view-btn" data-v="left">左视</button>
        <button class="crash-view-btn" data-v="iso">立体</button>
        <button class="btn btn-secondary btn-sm" id="crash-reset-view">↻ 重置视角</button>
      </div>
      <div class="crash-center">
        <div class="crash-3d" id="crash-3d">
          <canvas id="crash-canvas"></canvas>
          <div class="crash-3d-hint">🖱 拖动旋转 · 滚轮缩放 · 拖中间分隔条调高度</div>
        </div>
        <div class="crash-divider" id="crash-divider" title="上下拖动调整高度"></div>
        <div class="crash-views" id="crash-views">
          <canvas id="crash-views-canvas"></canvas>
        </div>
      </div>
    </div>

    <!-- 右侧：思路 + 答案 -->
    <div class="panel-right crash-right">
      <h2>思路 · 答案</h2>
      <div class="panel-body crash-body">
        <div id="crash-shape" class="crash-shape"></div>
        <div id="crash-prob" class="crash-prob"></div>
        <div class="crash-sec-title">📐 三步思路（直给）</div>
        <div id="crash-approach"></div>
        <button class="btn btn-warn" id="crash-toggle-answer" style="width:100%;justify-content:center">👁 查看答案</button>
        <div id="crash-answer" class="crash-answer"></div>
        <div class="crash-nav">
          <button class="btn btn-secondary btn-sm" id="crash-prev">← 上一题</button>
          <span class="crash-count">←→ 切题 · 空格看答案</span>
          <button class="btn btn-secondary btn-sm" id="crash-next">下一题 →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════ 分章节学习 ═══════════ -->
  <div id="sec-practice" class="section">
    <!-- 左侧：章节导航 -->
    <div class="panel-left">
      <h2>📚 章节导航</h2>
      <div class="panel-body">
        <!-- 章节选择 -->
        <div class="field">
          <label>选择章节</label>
          <div style="display:flex;gap:4px;margin-bottom:8px">
            <button class="btn btn-secondary btn-sm" id="btn-chapter-prev">◀ 上一章</button>
            <button class="btn btn-secondary btn-sm" id="btn-chapter-next">下一章 ▶</button>
          </div>
          <select id="chapter-select"></select>
        </div>

        <div style="text-align:center;margin:10px 0;padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)">
          <div id="chapter-title" style="font-size:14px;font-weight:600;color:var(--accent)"></div>
          <div id="chapter-subtitle" style="font-size:11.5px;color:var(--muted);margin-top:3px"></div>
        </div>

        <!-- 本节内容切换 -->
        <div class="section-tabs">
          <button class="section-btn active" data-section="theory">📖 理论学习</button>
          <button class="section-btn" data-section="example">📝 例题精讲</button>
          <button class="section-btn" data-section="exercise">✏️ 课后习题</button>
        </div>

        <!-- 例题导航 -->
        <div id="example-nav" class="sub-nav">
          <div class="sub-nav-label">例题 <span id="example-count" style="color:var(--muted);font-size:11px"></span></div>
          <div class="btn-group">
            <button class="btn btn-secondary btn-sm" id="btn-ex-prev">← 上例</button>
            <button class="btn btn-secondary btn-sm" id="btn-ex-next">下例 →</button>
          </div>
        </div>

        <!-- 习题导航 -->
        <div id="exercise-nav" class="sub-nav">
          <div class="sub-nav-label">习题 <span id="exercise-count" style="color:var(--muted);font-size:11px"></span></div>
          <div class="btn-group">
            <button class="btn btn-secondary btn-sm" id="btn-exer-prev">← 上一题</button>
            <button class="btn btn-secondary btn-sm" id="btn-exer-next">下一题 →</button>
          </div>
          <div class="btn-group" style="margin-top:8px">
            <button class="btn btn-warn btn-sm" id="btn-show-answer">👁 查看答案</button>
          </div>
        </div>

        <!-- 解题按钮 -->
        <div class="btn-group" style="margin-top:12px">
          <button class="btn btn-primary" id="btn-show-solution">📐 逐步解析</button>
        </div>

      </div>
    </div>

    <!-- 中央：3D + 绘图区 -->
    <div class="panel-center">
      <div class="view-switcher">
        <button class="view-btn active" data-view="3d">3D 模型</button>
        <button class="view-btn" data-view="draw">绘图练习</button>
        <button class="view-btn" data-view="both">3D + 三视图</button>
      </div>
      <div class="canvas-area" id="canvas-area">
        <div class="progress-bar" id="progress-bar"></div>
        <!-- 理论学习内容区 -->
        <div id="content-area" style="display:none"></div>
        <!-- 3D 视图 -->
        <canvas id="three-canvas" style="display:none"></canvas>
        <!-- 三视图画布 -->
        <canvas id="views-canvas" style="display:none;position:absolute;top:0;right:0;left:auto;width:65%;height:100%;pointer-events:none"></canvas>
        <!-- 绘图区 -->
        <div id="draw-area" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%">
          <div class="toolbar">
            <button id="tool-line" title="直线">╱</button>
            <button id="tool-arc" title="圆弧">⌒</button>
            <button id="tool-ellipse" title="椭圆">◯</button>
            <button id="tool-rect" title="矩形">▭</button>
            <button id="tool-undo" title="撤销">↩</button>
            <button id="tool-clear" title="清空">✕</button>
            <button id="tool-snap" title="吸附" class="active">⊞</button>
          </div>
          <canvas id="draw-canvas"></canvas>
          <div class="legend">
            <div class="legend-row"><div class="legend-line visible"></div><span>可见轮廓线</span></div>
            <div class="legend-row"><div class="legend-line hidden"></div><span>不可见轮廓线</span></div>
            <div class="legend-row"><div class="legend-line section"></div><span>剖切线</span></div>
          </div>
        </div>
        <div class="tooltip" id="tooltip"></div>
      </div>
    </div>

    <!-- 右侧：题目+解析 -->
    <div class="panel-right">
      <h2>题目与解析</h2>
      <div class="panel-body" style="padding:0">
        <div class="problem-box" id="problem-box" style="display:none;margin:12px 12px 0">
          <h3 id="prob-title">题目</h3>
          <div class="problem-tags" id="prob-tags"></div>
          <p id="prob-desc" style="margin-top:8px"></p>
        </div>
        <!-- 答案区 -->
        <div id="answer-area" style="display:none;margin:10px 12px"></div>
        <!-- 解题步骤 -->
        <div class="solution-steps" id="solution-steps">
          <div style="text-align:center;color:var(--muted);padding:40px 20px;font-size:13px;line-height:1.8">
            <div style="font-size:32px;margin-bottom:12px">📐</div>
            点击 <b style="color:var(--accent)">"📐 逐步解析"</b> 查看解题步骤
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════ 解题教程 ═══════════ -->
  <div id="sec-guide" class="section">
      <div class="panel-left" style="width:220px;min-width:200px;flex-shrink:0">
        <h2>教程目录</h2>
        <div class="panel-body" id="guide-toc">
          <div style="font-size:13.5px;line-height:2.2;cursor:pointer" data-guide="1" class="guide-item active">
            <b style="color:var(--accent)">①</b> 投影法基础
          </div>
          <div style="font-size:13.5px;line-height:2.2;cursor:pointer" data-guide="2" class="guide-item">
            <b style="color:var(--accent)">②</b> 基本体三视图
          </div>
          <div style="font-size:13.5px;line-height:2.2;cursor:pointer" data-guide="3" class="guide-item">
            <b style="color:var(--accent)">③</b> 组合体分析
          </div>
          <div style="font-size:13.5px;line-height:2.2;cursor:pointer" data-guide="4" class="guide-item">
            <b style="color:var(--accent)">④</b> 截交线
          </div>
          <div style="font-size:13.5px;line-height:2.2;cursor:pointer" data-guide="5" class="guide-item">
            <b style="color:var(--accent)">⑤</b> 相贯线
          </div>
          <div style="font-size:13.5px;line-height:2.2;cursor:pointer" data-guide="6" class="guide-item">
            <b style="color:var(--accent)">⑥</b> 答题思维方法
          </div>
        </div>
      </div>
      <div class="panel-center" id="guide-center" style="overflow-y:auto;flex:1;min-width:0">
        <div id="guide-content" style="padding:24px;max-width:860px;line-height:1.9;font-size:14px"></div>
      </div>
  </div>

  <!-- ═══════════ 3D 模型查看弹窗 ═══════════ -->
<div id="model-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--bg);border:1px solid var(--border);border-radius:14px;width:100%;max-width:820px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:20px">🧊</span>
        <span id="guide-shape-name" style="color:var(--accent);font-weight:600;font-size:16px">3D 模型</span>
      </div>
      <button id="model-close-btn" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1">×</button>
    </div>
    <div style="display:flex;flex:1;min-height:0">
      <div style="flex:1;min-width:0;background:#f5f0e8;position:relative">
        <canvas id="guide-canvas" style="display:block;width:100%;height:100%"></canvas>
        <div style="position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px">
          <button class="btn btn-sm" id="guide-view-front" style="padding:6px 14px">主视</button>
          <button class="btn btn-sm" id="guide-view-top" style="padding:6px 14px">俯视</button>
          <button class="btn btn-sm" id="guide-view-left" style="padding:6px 14px">左视</button>
          <button class="btn btn-sm" id="guide-view-iso" style="padding:6px 14px">立体</button>
        </div>
      </div>
      <div id="guide-notes" style="width:240px;border-left:1px solid var(--border);overflow-y:auto;background:var(--panel)"></div>
    </div>
  </div>
</div>

<!-- 脚本 -->
<script src="js/chapters.js?v=20261112d"></script>
<script src="js/shapes.js?v=20261112d"></script>
<script src="js/engine.js?v=20261112e"></script>
<script src="js/problems.js?v=20261112d"></script>
<script src="js/crash.js?v=20261112f"></script>
<script src="js/app.js?v=20261112i"></script>

</body>
</html>
